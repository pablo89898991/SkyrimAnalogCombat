; =====================================================================
;  Directional Combat – analogowy / kierunkowy tryb walki
;  Trzymaj LPM, odciągnij mysz w jedną stronę (zamach),
;  potem szarpnij w przeciwną – cios poleci z tej strony, którą wybrałeś.
; =====================================================================

[General]
Enabled = true
; Kamera stoi w miejscu, gdy trzymasz LPM z wyjętą bronią
FreezeCamera = true
; Po ciosie, bez puszczania LPM, możesz od razu brać kolejny zamach (machanie tam i z powrotem)
ChainStrikes = true
; Puszczenie LPM po wykonanym zamachu też wyprowadza cios
StrikeOnRelease = true
; Szybkie kliknięcie LPM bez ruchu myszy = zwykły atak vanilla
TapForNormalAttack = true
; Zapisuje każdy gest do Documents\My Games\Skyrim Special Edition\SKSE\DirectionalCombat.log
DebugLog = false

[Mouse]
; Ile ruchu myszy (surowe jednostki) potrzeba, żeby "uzbroić" zamach
WindupThreshold = 80
; Ile ruchu w przeciwną stronę, żeby wyprowadzić cios
StrikeThreshold = 50
Sensitivity = 1.0
; Ustaw na true, jeśli zamach w górę/dół jest odwrócony
InvertY = false

[Gamepad]
; Trzymaj prawy spust, wychyl prawy drążek (zamach), potem przerzuć w drugą stronę
Enabled = true
StickWindup = 0.70
StickStrike = 0.50

[Timing]
; Sekundy po ciosie, zanim można uzbroić kolejny zamach
StrikeCooldown = 0.30
; Maksymalny czas kliknięcia uznawanego za zwykły atak
TapMaxTime = 0.25

[Animations]
; Zdarzenia grafu animacji dla każdego kierunku ZAMACHU (cios leci w przeciwną stronę).
; Domyślnie używane są kierunkowe ciosy mocy z vanilli, bo tylko one różnią się kierunkiem.
; Z własnymi animacjami (OAR) możesz tu wpisać dowolne zdarzenia.
WindupLeft  = attackPowerStartLeft
WindupRight = attackPowerStartRight
WindupUp    = attackPowerStartForward
WindupDown  = attackPowerStartInPlace
; Zwykły atak (kliknięcie) i zapas, gdy kierunkowy się nie uda (np. brak staminy)
NormalAttack = attackStart
Fallback     = attackStart
; Zamień, jeśli cięcia poziome lecą w złą stronę
SwapLeftRight = false

[Integration]
; Opcjonalnie: zapisz kierunek zamachu do wartości aktora gracza
; (1=Left 2=Right 3=Up 4=Down) – do warunków w Open Animation Replacer.
; Przykład: DirectionActorValue = Variable09   (puste = wyłączone)
DirectionActorValue =
