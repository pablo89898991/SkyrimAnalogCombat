; =====================================================================
;  Directional Combat – analogowy / kierunkowy tryb walki
;  Trzymaj LPM, odciągnij mysz w jedną stronę (zamach),
;  potem szarpnij w przeciwną – cios poleci z tej strony, którą wybrałeś.
; =====================================================================

[General]
Enabled = true
; Kamera stoi w miejscu, gdy trzymasz LPM z wyjętą bronią
FreezeCamera = true
; Po ciosie, bez puszczania LPM, możesz od razu brać kolejny zamach (machanie tam i z powrotem)
ChainStrikes = true
; Puszczenie LPM po wykonanym zamachu też wyprowadza cios
StrikeOnRelease = true
; Szybkie kliknięcie LPM bez ruchu myszy = zwykły atak vanilla
TapForNormalAttack = true
; Na ile kierunków dzielony jest okrąg: 4, 8 albo 16 (jak w Dead Island)
Directions = 16
; Zapisuje każdy gest do Documents\My Games\Skyrim Special Edition\SKSE\DirectionalCombat.log
DebugLog = false
; Zmiany w tym pliku działają od razu po zapisaniu (bez restartu gry)
LiveReload = true

[FloatingWeapon]
; Ukryj ręce i rękawice w 1. osobie, widać samą broń
HideArms = true
; true = ręce znikają tylko z wyjętą bronią białą
HideArmsOnlyWhenDrawn = true

[Procedural]
; W 1. osobie mod SAM animuje broń: spoczynek, zamach po okręgu i cięcie łukiem
; pod dowolnym z 16 kątów. Gra dostaje tylko zwykły atak (od obrażeń).
; W 3. osobie dalej działają animacje z sekcji [Animations].
Enabled = true
; Zdarzenie wysyłane do gry przy ciosie (zwykły atak)
AttackEvent = attackStart
; Cios mocy: przytrzymaj zamach przez tyle sekund (0 = nigdy nie rób ciosu mocy)
PowerChargeTime = 0
PowerAttackEvent = attackPowerStartInPlace

; --- Ustawienie broni (jednostki gry, ~1.4 cm; X = w prawo, Z = w górę) ---
; Odległość broni przed kamerą
Distance = 45
; Środek okręgu zamachu
CenterX = 4
CenterZ = -6
; Promień okręgu: jak daleko w bok/górę/dół idzie zamach
Radius = 22
; Zamach przyciąga broń do kamery, cięcie wysuwa ją do przodu
PullBack = 10
Reach = 14
; Pozycja spoczynkowa (gdy nie trzymasz LPM)
RestX = 16
RestZ = -16
; Pochylenie ostrza do przodu w spoczynku (stopnie)
RestTilt = 25

; --- Ruch ---
; Mnożnik czasu cięcia. Czas bazowy zależy od broni (sztylet szybko, młot wolno).
; 1.2 = wolniej i ciężej, 0.8 = szybciej
SwingTimeScale = 1.0
; Jak szybko broń dogania ruch (większe = szybciej)
Smoothing = 18

; --- Gdy broń jest źle obrócona ---
; Rękojeść na zewnątrz zamiast ostrza -> true
FlipBlade = false
; Obrót broni wokół ostrza w stopniach (np. 90 jeśli tniesz płazem)
BladeRoll = 0
; Obracaj wokół środka broni (efekt latania) zamiast wokół rękojeści
PivotAtCenter = true

[Feel]
; Wszystko, co sprawia, że walka wygląda jak wbudowana w grę.
; Tempo, zasięg i bezwładność zależne od typu i wagi broni
WeaponWeight = true
; Mod mierzy, kiedy gra liczy trafienie, i dopasowuje tempo cięcia tak,
; by ostrze przechodziło przez środek ekranu dokładnie w momencie trafienia
SyncToHits = true
; O ile broń "przelatuje" za drugą stronę po cięciu (0 = staje równo)
Overshoot = 0.18
; Kołysanie broni przy chodzeniu/bieganiu (0 = wył., 1 = normalnie)
WalkBob = 1.0
; Broń spóźnia się za obrotem kamery (ciężka broń bardziej)
CameraSway = 1.0
; Delikatny ruch "oddechu" w spoczynku
Breathing = 1.0
; Przy trafieniu cięcie na moment staje (s) – daje wrażenie oporu
HitStop = 0.06
; Odbicie broni po trafieniu
HitRecoil = 1.0
; Drżenie kamery przy trafieniu (0 = wył.)
HitShake = 0.15
; Podczas bloku (PPM) broń ustawia się w poprzek ekranu
BlockPose = true
; Po wyjęciu broń "wjeżdża" od dołu
DrawAnimation = true

[Mouse]
; Ile ruchu myszy (surowe jednostki) potrzeba, żeby "uzbroić" zamach
WindupThreshold = 80
; Ile ruchu w przeciwną stronę, żeby wyprowadzić cios
StrikeThreshold = 50
Sensitivity = 1.0
; Ustaw na true, jeśli zamach w górę/dół jest odwrócony
InvertY = false

[Gamepad]
; Trzymaj prawy spust, wychyl prawy drążek (zamach), potem przerzuć w drugą stronę
Enabled = true
StickWindup = 0.70
StickStrike = 0.50

[Timing]
; Sekundy po ciosie, zanim można uzbroić kolejny zamach (cooldown)
StrikeCooldown = 0.30
; Gdy poprzedni atak jeszcze trwa, cios czeka w buforze maks. tyle sekund i wchodzi,
; gdy tylko gra pozwoli (zwykle w oknie kombo). Animacja cięcia rusza dopiero wtedy,
; więc każdy widoczny cios zadaje obrażenia. 0 = bez bufora.
StrikeBufferTime = 0.8
; Maksymalny czas kliknięcia uznawanego za zwykły atak
TapMaxTime = 0.25

[Animations]
; Kąt ZAMACHU liczony przeciwnie do wskazówek zegara: 0° = prawo, 90° = góra, 180° = lewo, 270° = dół.
; Cios leci w przeciwną stronę (zamach w prawo-górę -> cięcie ukośne w lewo-dół).
;
; Animacje bazowe dla 4 głównych kierunków. Vanilla ma kierunkowe tylko ciosy mocy.
WindupRight = attackPowerStartRight
WindupUp    = attackPowerStartForward
WindupLeft  = attackPowerStartLeft
WindupDown  = attackPowerStartInPlace

; Opcjonalnie: osobna animacja dla każdego z 16 kątów.
; Puste = najbliższa animacja bazowa (skosy dokładnie 45° -> cięcie poziome).
; Przydaje się, gdy masz paczkę animacji z ukośnymi cięciami.
Windup_000 =    ;   0.0°  zamach prawo
Windup_022 =    ;  22.5°  zamach prawo-prawo-góra
Windup_045 =    ;  45.0°  zamach prawo-góra
Windup_067 =    ;  67.5°  zamach góra-góra-prawo
Windup_090 =    ;  90.0°  zamach góra
Windup_112 =    ; 112.5°  zamach góra-góra-lewo
Windup_135 =    ; 135.0°  zamach lewo-góra
Windup_157 =    ; 157.5°  zamach lewo-lewo-góra
Windup_180 =    ; 180.0°  zamach lewo
Windup_202 =    ; 202.5°  zamach lewo-lewo-dół
Windup_225 =    ; 225.0°  zamach lewo-dół
Windup_247 =    ; 247.5°  zamach dół-dół-lewo
Windup_270 =    ; 270.0°  zamach dół
Windup_292 =    ; 292.5°  zamach dół-dół-prawo
Windup_315 =    ; 315.0°  zamach prawo-dół
Windup_337 =    ; 337.5°  zamach prawo-prawo-dół

; Zwykły atak (kliknięcie) i zapas, gdy kierunkowy się nie uda (np. brak staminy)
NormalAttack = attackStart
Fallback     = attackStart
; Zamień, jeśli cięcia poziome lecą w złą stronę (lustro całego okręgu)
SwapLeftRight = false

[Integration]
; Opcjonalnie: zapisz kierunek zamachu do wartości aktora gracza – do warunków w Open Animation Replacer.
; DirectionActorValue: numer sektora 1..16 (1 = prawo, 5 = góra, 9 = lewo, 13 = dół, przeciwnie do wskazówek zegara)
; AngleActorValue:     dokładny kąt 0..360° (pełny analog)
; Przykład: DirectionActorValue = Variable09   (puste = wyłączone)
DirectionActorValue =
AngleActorValue =
